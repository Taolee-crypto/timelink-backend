name = "timelink-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "timelink-db"
database_id = "7a61cb9f-d368-439e-b175-f3e958aeb84f"

# Provisioned with the Cloudflare management connection. Retain the existing
# binding without requiring the CI deploy token to enumerate R2 buckets.
[[unsafe.bindings]]
name = "STORE_MUSIC_BUCKET"
type = "inherit"


[vars]
V5_SCORE_AUTH_MODE = "github-oidc"
ENVIRONMENT = "production"
JETTON_MINTER = "EQBliopwW-3NYXWW7bKO5oW2CGiyYJ4EDxke6KwqZs9cNy_h"
TON_NETWORK = "testnet"

[triggers]
crons = ["* * * * *"]



[placement]
mode = "smart"
