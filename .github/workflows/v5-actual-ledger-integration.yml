name: V5 Actual Ledger Integration
on:
  pull_request:
    paths: ['src/economy-ledger.ts','src/economy-policy.ts','scripts/test-v5-real-ledger-sqlite.cjs','.github/workflows/v5-actual-ledger-integration.yml']
  push:
    branches: [main]
    paths: ['src/economy-ledger.ts','src/economy-policy.ts','scripts/test-v5-real-ledger-sqlite.cjs','.github/workflows/v5-actual-ledger-integration.yml']
  workflow_dispatch:
jobs:
  ledger-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/test-v5-real-ledger-sqlite.cjs
