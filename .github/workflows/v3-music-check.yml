name: V3 music core validation

on:
  pull_request:
    branches: [main]
    paths:
      - "migrations/0004_v3_music_core.sql"
      - "scripts/validate-v3-music.py"
      - ".github/workflows/v3-music-check.yml"
  push:
    branches: [main]
    paths:
      - "migrations/0004_v3_music_core.sql"
      - "scripts/validate-v3-music.py"
      - ".github/workflows/v3-music-check.yml"

jobs:
  sqlite-music-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate V3 music schema and invariants
        run: python scripts/validate-v3-music.py
