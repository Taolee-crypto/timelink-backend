name: Backend validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - feature/renewal-private-library-api

permissions:
  contents: read

jobs:
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate stream authorization regression guards
        run: python scripts/validate-stream-auth.py
      - name: Verify song-linked TRACK V5 score contract
        run: node scripts/test-track-v5-score-status.cjs
      - name: Verify owner draft security and no-charge contract
        run: node scripts/test-v5-score-owner-draft.cjs
      - name: Validate Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist
