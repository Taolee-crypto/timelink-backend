name: Backend validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - feature/renewal-private-library-api

permissions:
  contents: read

jobs:
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate stream authorization regression guards
        run: python scripts/validate-stream-auth.py
      - name: Prevent retired score service from returning
        run: node scripts/test-v5-score-retired.cjs
      - name: Verify numeric TRACK references resolve to V5 file IDs
        run: node scripts/test-v5-numeric-resolve.cjs
      - name: Verify TILO administrator discount evidence and settlement safety
        run: node scripts/test-tilo-flexible-discount.cjs
      - name: Enforce territorial TILO station broadcaster licenses
        run: node scripts/test-tilo-station-v5.cjs
      - name: Check TILO station operational evidence and rights
        run: node scripts/test-tilo-v5-operations.cjs
      - name: Verify country rights grant reviewer owner and revocation guards
        run: node scripts/test-tilo-country-grant-audit.cjs
      - name: Verify member profile account-bound contract
        run: node scripts/test-member-profile-v5.cjs
      - name: Test TILO bulk country grant ownership and audited atomicity
        run: node scripts/test-tilo-bulk-grant.cjs
      - name: Validate Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist
