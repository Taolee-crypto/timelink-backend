name: Backend validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - feature/renewal-private-library-api

permissions:
  contents: read

jobs:
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist
