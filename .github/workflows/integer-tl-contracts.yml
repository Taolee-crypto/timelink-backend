name: Integer TL contracts
on:
  push:
    paths:
      - 'src/economy-ledger.ts'
      - 'src/economics.ts'
      - 'scripts/test-integer-tl-contract.cjs'
      - '.github/workflows/integer-tl-contracts.yml'
  pull_request:
    paths:
      - 'src/economy-ledger.ts'
      - 'src/economics.ts'
      - 'scripts/test-integer-tl-contract.cjs'
      - '.github/workflows/integer-tl-contracts.yml'
jobs:
  integer-tl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-integer-tl-contract.cjs
