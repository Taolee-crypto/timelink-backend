name: Correct Music Gate model for the reported free-tier test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/music-gate-model-repair.yml']
permissions:
  contents: read
jobs:
  repair-model:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set the current audio model and recover only the reported model-not-found review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url),wrangler=require.resolve('wrangler/bin/wrangler.js');
          const model=spawnSync(process.execPath,[wrangler,'secret','put','MUSIC_GATE_GEMINI_MODEL'],{encoding:'utf8',input:'gemini-3.5-flash-lite\n',maxBuffer:1024*1024});
          if(model.status!==0)throw Error('Worker model setting update failed. No raw configuration output emitted.');
          console.log('MUSIC_GATE_GEMINI_MODEL updated to gemini-3.5-flash-lite; billing settings unchanged.');
          const sql="UPDATE v5_music_gate_reviews SET status='pending_analysis',analysis_attempts=0,analysis_token=NULL,analysis_lease_until=NULL,analysis_next_at=0,analysis_error=NULL,evidence_sha256=NULL,reasons_json='[\"MODEL_CONFIGURATION_RECOVERED\"]',evidence_json=json_set(CASE WHEN json_valid(evidence_json) THEN evidence_json ELSE '{}' END,'$.model_configuration_recovered',1,'$.analysis_stage','queued'),updated_at=datetime('now') WHERE id='b169d21e-7bc7-4b49-98a9-c82a19be66c9' AND status='review_required' AND analysis_error='AI_HTTP_404' AND COALESCE(json_extract(CASE WHEN json_valid(evidence_json) THEN evidence_json ELSE '{}' END,'$.model_configuration_recovered'),0)=0";
          const repair=spawnSync(process.execPath,[wrangler,'d1','execute','timelink-db','--remote','--command',sql,'--json'],{encoding:'utf8',maxBuffer:1024*1024});
          if(repair.status!==0)throw Error('Reported review recovery failed.');
          const result=JSON.parse(repair.stdout);
          if(result.some(x=>x.success===false))throw Error('Reported review recovery rejected.');
          console.log('Targeted model-not-found review recovery submitted; no approval or sanctions were changed.');
          JS
