name: V3 SharePlace and social validation

on:
  pull_request:
    branches: [v3/music-review-admin]
    paths:
      - "src/routes/music-v3-public.ts"
      - "src/routes/music-v3-social.ts"
      - "src/routes/music-v3-admin.ts"
      - "src/routes/music-v3.ts"
      - "src/index.ts"
      - "migrations/0004_v3_music_core.sql"
      - "migrations/0005_v3_music_review_audit.sql"
      - "migrations/0006_v3_music_social.sql"
      - "scripts/validate-v3-music.py"
      - "scripts/validate-v3-music-review.py"
      - "scripts/validate-v3-music-social.py"
      - ".github/workflows/v3-music-social-check.yml"
  push:
    branches: [v3/music-shareplace-social]
    paths:
      - "src/routes/music-v3-public.ts"
      - "src/routes/music-v3-social.ts"
      - "src/routes/music-v3-admin.ts"
      - "src/routes/music-v3.ts"
      - "src/index.ts"
      - "migrations/0004_v3_music_core.sql"
      - "migrations/0005_v3_music_review_audit.sql"
      - "migrations/0006_v3_music_social.sql"
      - "scripts/validate-v3-music.py"
      - "scripts/validate-v3-music-review.py"
      - "scripts/validate-v3-music-social.py"
      - ".github/workflows/v3-music-social-check.yml"

jobs:
  worker-build-and-social-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile Worker without deployment
        run: npx wrangler deploy --dry-run
      - name: Validate V3 schema, review and social gates
        run: |
          python scripts/validate-v3-music.py
          python scripts/validate-v3-music-review.py
          python scripts/validate-v3-music-social.py
