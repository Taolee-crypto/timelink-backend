name: TLD score / LOVE CODE contract
on:
  pull_request:
    paths:
      - 'src/tld-score-core.ts'
      - 'scripts/test-tld-score-love-code.cjs'
      - 'docs/TLD_SCORE_LOVE_CODE_V5.md'
      - '.github/workflows/tld-score-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/tld-score-core.ts'
      - 'scripts/test-tld-score-love-code.cjs'
      - 'docs/TLD_SCORE_LOVE_CODE_V5.md'
      - '.github/workflows/tld-score-contract.yml'
permissions:
  contents: read
jobs:
  verify-tld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate TypeScript including TLD codec
        run: npx --no-install tsc --noEmit
      - name: Verify protected TLD and file-viewer LOVE CODE
        run: node scripts/test-tld-score-love-code.cjs
