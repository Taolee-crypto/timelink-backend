name: V5 operational watch and recovery readiness
on:
  pull_request:
    paths:
      - 'scripts/v5-release-watch.cjs'
      - 'scripts/test-v5-release-watch.cjs'
      - 'docs/V5_RELEASE_MONITOR_RECOVERY_20261029.md'
      - '.github/workflows/v5-ops-watch.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/v5-release-watch.cjs'
      - 'scripts/test-v5-release-watch.cjs'
      - 'docs/V5_RELEASE_MONITOR_RECOVERY_20261029.md'
      - '.github/workflows/v5-ops-watch.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only watch and isolated SQLite snapshot restore
        run: node scripts/test-v5-release-watch.cjs
  production-readonly-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: isolated-recovery-contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check CI watch credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read-only Cloudflare Worker / D1 PITR / Pages monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/v5-release-watch.cjs
