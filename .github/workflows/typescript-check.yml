name: Backend TypeScript validation

on:
  pull_request:
    branches: [main, v3/legacy-storage-compat]
  push:
    branches: [v3/typescript-ci-hardening]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: TypeScript strict check
        run: npx --no-install tsc --noEmit
      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run
