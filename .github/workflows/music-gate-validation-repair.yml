name: Recover the reported Music Gate validation failure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/music-gate-validation-repair.yml']
permissions:
  contents: read
jobs:
  repair-validation:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Recover only the reported output-validation failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          const sql="UPDATE v5_music_gate_reviews SET status='pending_analysis',analysis_attempts=0,analysis_token=NULL,analysis_lease_until=NULL,analysis_next_at=0,analysis_error=NULL,evidence_sha256=NULL,reasons_json='[\"OUTPUT_VALIDATION_RECOVERED\"]',evidence_json=json_set(CASE WHEN json_valid(evidence_json) THEN evidence_json ELSE '{}' END,'$.output_validation_recovered',1,'$.analysis_stage','queued'),updated_at=datetime('now') WHERE id='b169d21e-7bc7-4b49-98a9-c82a19be66c9' AND status IN ('pending_analysis','review_required') AND analysis_error='INVALID_AI_OUTPUT' AND json_extract(CASE WHEN json_valid(evidence_json) THEN evidence_json ELSE '{}' END,'$.analysis_stage')='validating_ai_output' AND COALESCE(json_extract(CASE WHEN json_valid(evidence_json) THEN evidence_json ELSE '{}' END,'$.output_validation_recovered'),0)=0";
          const r=spawnSync(process.execPath,[require.resolve('wrangler/bin/wrangler.js'),'d1','execute','timelink-db','--remote','--command',sql,'--json'],{encoding:'utf8',maxBuffer:1024*1024});
          if(r.status!==0)throw Error('Reported validation recovery failed.');
          if(JSON.parse(r.stdout).some(x=>x.success===false))throw Error('Reported validation recovery rejected.');
          console.log('Targeted validation-failure recovery submitted. No approvals, sanctions, audio or credentials were changed.');
          JS
