name: V5 economy renewal validation
on:
  pull_request:
    paths: ['src/**', 'scripts/test-v5-economy-renewal.cjs', 'scripts/test-v5-daily-free.mjs', 'scripts/test-v5-subscription-meter.cjs', 'scripts/test-v5-subscription-playback.cjs', 'scripts/test-v5-subscription-review.cjs', 'scripts/test-time-free.cjs', 'scripts/test-v5-music-orders.cjs', '.github/workflows/v5-economy-renewal.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/test-time-free.cjs', 'scripts/test-v5-music-orders.cjs', 'scripts/test-v5-subscription-meter.cjs', 'scripts/test-v5-subscription-playback.cjs', 'scripts/test-v5-subscription-review.cjs', '.github/workflows/v5-economy-renewal.yml']
jobs:
  economy-renewal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: node scripts/test-v5-daily-free.mjs
      - run: node scripts/test-v5-subscription-meter.cjs
      - run: node scripts/test-v5-subscription-playback.cjs
      - run: node scripts/test-time-free.cjs
      - run: node scripts/test-v5-subscription-review.cjs
      - run: node scripts/test-v5-music-orders.cjs
      - run: node scripts/test-v5-economy-renewal.cjs
      - run: node scripts/test-v5-real-ledger-sqlite.cjs
      - run: node scripts/test-self-play-income.cjs
      - run: node scripts/test-creator-payout-report.cjs
      - run: node scripts/test-creator-contributors.cjs
      - run: node scripts/test-v5-trace-d1.cjs

