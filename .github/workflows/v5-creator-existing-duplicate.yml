name: V5 creator existing release privacy and duplicate contract
on:
  pull_request:
    paths:
      - 'src/routes/music-discovery.ts'
      - 'scripts/test-v5-creator-private-duplicate.cjs'
      - 'scripts/test-v5-track-rights-e2e.cjs'
      - 'scripts/test-v5-track-rights-contract.cjs'
      - 'src/v5-recording-identity.ts'
      - 'src/routes/tl3-v5.ts'
      - 'scripts/test-creator-contributors.cjs'
      - 'scripts/test-creator-payout-report.cjs'
      - 'scripts/test-v5-music-gate-worker.cjs'
      - '.github/workflows/v5-creator-existing-duplicate.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/music-discovery.ts'
      - 'scripts/test-v5-creator-private-duplicate.cjs'
      - 'scripts/test-v5-track-rights-e2e.cjs'
      - 'scripts/test-v5-track-rights-contract.cjs'
      - 'src/v5-recording-identity.ts'
      - 'src/routes/tl3-v5.ts'
      - 'scripts/test-creator-contributors.cjs'
      - 'scripts/test-creator-payout-report.cjs'
      - 'scripts/test-v5-music-gate-worker.cjs'
      - '.github/workflows/v5-creator-existing-duplicate.yml'
permissions:
  contents: read
jobs:
  verified-private-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run actual Hono/D1 private recording and duplicate guard
        run: node scripts/test-v5-creator-private-duplicate.cjs
      - name: Verify track-level registered duplicate and rights-review lifecycle
        run: node scripts/test-v5-track-rights-e2e.cjs
      - name: Verify duplicate gate precedes V5 manufacture
        run: node scripts/test-v5-track-rights-contract.cjs
      - name: Verify source-linked audio review and audit immutability
        run: node scripts/test-v5-music-gate-worker.cjs
      - name: Verify multi-rights ownership, escrow and creator shares
        run: node scripts/test-creator-contributors.cjs
      - name: Verify read-only creator payout and historical ledger audits
        run: node scripts/test-creator-payout-report.cjs
      - name: Validate TypeScript
        run: npx --no-install tsc --noEmit
