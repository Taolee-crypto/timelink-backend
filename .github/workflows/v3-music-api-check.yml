name: V3 music API validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/music-v3.ts"
      - "src/index.ts"
      - "migrations/0004_v3_music_core.sql"
      - "scripts/validate-v3-music.py"
      - ".github/workflows/v3-music-api-check.yml"
  push:
    branches: [main]
    paths:
      - "src/routes/music-v3.ts"
      - "src/index.ts"
      - "migrations/0004_v3_music_core.sql"
      - "scripts/validate-v3-music.py"
      - ".github/workflows/v3-music-api-check.yml"

jobs:
  worker-build-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile Worker without deployment
        run: npx wrangler deploy --dry-run
      - name: Validate V3 music schema and invariants
        run: python scripts/validate-v3-music.py
