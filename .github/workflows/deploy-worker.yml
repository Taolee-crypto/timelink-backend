name: Deploy TimeLink API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: timelink-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx --no-install tsc --noEmit

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set repository secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set repository secret CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
