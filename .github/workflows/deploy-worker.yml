name: Deploy TimeLink API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: timelink-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx --no-install tsc --noEmit

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set repository secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set repository secret CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply timelink-db --remote

      - name: Deploy Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke-test TL3 Spine v4 route
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/spine-response.json -w '%{http_code}' -X POST 'https://api.timelink.digital/api/v1/tl3/spine/releases' -H 'Content-Type: application/json' --data '{}')
          cat /tmp/spine-response.json
          test "$code" = "400" || (echo "Expected route-level HTTP 400, got $code" && exit 1)
          grep -q '저작권' /tmp/spine-response.json
