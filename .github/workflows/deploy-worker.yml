name: Deploy TimeLink API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/prepare-tilo-schema.cjs"
      - "scripts/prepare-sales-managers.cjs"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: timelink-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx --no-install tsc --noEmit

      - name: Verify Music Gate analysis and review integration
        run: node scripts/test-v5-music-gate-worker.cjs

      - name: Verify sales managers, owner-controlled stores and cafe service ledger
        run: node scripts/test-sales-managers.cjs

      - name: Verify partner settlement, tax and ledger integration
        run: node scripts/test-sales-finance.cjs

      - name: Verify Korean accounting, tax and closing invariants
        run: node scripts/test-kr-finance.cjs

      - name: Verify cash receipt finance report
        run: node scripts/test-admin-finance.cjs

      - name: Verify V5 certificate fee calculations and atomic payment
        run: node scripts/test-v5-certificate-fees.cjs

      - name: Verify paid self-play creator income and historical release
        run: node scripts/test-self-play-income.cjs

      - name: Verify creator earnings and owner isolation
        run: node scripts/test-creator-payout-report.cjs

      - name: Verify DJ V5 library and station workflow
        run: node scripts/test-dj-v5-center.cjs

      - name: Verify Music Gate in the actual Cloudflare runtime
        run: node scripts/test-v5-music-gate-workerd.cjs

      - name: Verify TILO station eligibility and evidence storage
        run: |
          node scripts/test-tilo-station-v5.cjs
          node scripts/test-tilo-airtime-storage.cjs
          node scripts/test-tilo-v5-contribution.cjs
          npx --no-install esbuild tests/tilo-v5-scheduler.test.ts --bundle --platform=node --format=cjs --outfile=/tmp/tilo-scheduler-test.cjs
          node /tmp/tilo-scheduler-test.cjs

      - name: Verify Creator catalogue import and contributor payouts
        run: |
          node scripts/test-spotify-catalogue.cjs
          node scripts/test-spotify-workerd.cjs
          node scripts/test-creator-contributors.cjs

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist

      - name: Verify subscription orders, included time and funding-aware economics
        run: |
          node scripts/test-v5-music-orders.cjs
          node scripts/test-v5-subscription-meter.cjs
          node scripts/test-v5-subscription-playback.cjs
          node scripts/test-v5-economy-renewal.cjs

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set repository secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set repository secret CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Prepare and verify Music Gate schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-music-gate-schema.cjs

      - name: Prepare and verify TILO evidence storage (no payout)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-tilo-schema.cjs

      - name: Prepare Korean accounting schema without posting balances
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-kr-finance.cjs

      - name: Prepare sales managers and store assignment schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-sales-managers.cjs

      - name: Deploy Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Music Gate deployment without inference or charge
        run: |
          node --input-type=module <<'JS'
          const response=await fetch('https://api.timelink.digital/api/v1/music-gate/health', {signal:AbortSignal.timeout(15000)});
          const health=await response.json();
          console.log(JSON.stringify(health));
          if(![200,503].includes(response.status)||health.pipeline_version!=='music-gate-audio-v1'||!health.schema_ready)
            throw Error('Music Gate Worker/schema deployment verification failed');
          if(!health.ready)console.log('Worker deployed; live inference is disabled or provider configuration is missing.');
          JS

      - name: Smoke-test asset registration route (no charge)
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/assets-response.json -w '%{http_code}' -X POST 'https://api.timelink.digital/api/v1/assets' -H 'Content-Type: application/json' --data '{}')
          cat /tmp/assets-response.json
          test "$code" = "401" || (echo "Asset registration route unavailable or auth guard missing: HTTP $code" && exit 1)
          grep -q '로그인' /tmp/assets-response.json

      - name: Smoke-test TL3 Spine v4 route
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/spine-response.json -w '%{http_code}' -X POST 'https://api.timelink.digital/api/v1/tl3/spine/releases' -H 'Content-Type: application/json' --data '{}')
          cat /tmp/spine-response.json
          test "$code" = "400" || (echo "Expected route-level HTTP 400, got $code" && exit 1)
          grep -q '저작권' /tmp/spine-response.json
