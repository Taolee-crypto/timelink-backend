name: Backend TypeScript validation

on:
  pull_request:
  push:
    branches:
      - feature/renewal-private-library-api

permissions:
  contents: read

jobs:
  typecheck:
    name: Strict TypeScript check (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci


      - name: Run strict TypeScript check
        run: npx --no-install tsc --noEmit
