name: V5 vocal score inference
on:
  workflow_run:
    workflows: ['Deploy TimeLink API Worker', 'V5 vocal transcription contract']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: v5-vocal-score-inference
  cancel-in-progress: false
jobs:
  infer:
    if: github.repository == 'Taolee-crypto/timelink-backend' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/vocal-transcription/requirements.txt
      # Cache only publicly downloadable model weights. Never cache decrypted
      # music, creator lyrics, OIDC tokens or any TL3 secret.
      - name: Cache public vocal model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/torch/hub/checkpoints
          key: timelink-v5-vocal-public-models-${{ runner.os }}-v1
      - name: Verify runner API contract before installing ML models
        run: |
          python -m pip install 'requests>=2.31,<3'
          python -m unittest discover -s services/vocal-transcription/tests -v
      - name: Install ffmpeg and vocal inference dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/vocal-transcription/requirements.txt
      - name: Process one authorized V5 vocal score job
        run: python services/vocal-transcription/run_job.py
