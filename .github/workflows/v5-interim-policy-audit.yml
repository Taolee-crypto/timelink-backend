name: V5 Interim Policy Audit
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/economy-ledger.ts', 'src/economy-policy.ts', 'scripts/audit-v5-interim-policy.mjs', 'scripts/test-v5-ledger-fixtures.mjs', 'tests/v5/local-ledger-fixture.sql', '.github/workflows/v5-interim-policy-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v5-interim-policy.mjs
